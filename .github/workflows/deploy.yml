name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  backend-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('clientes/pom.xml') }}
          restore-keys: maven-

      - name: Download dependencies
        working-directory: ./clientes
        run: mvn dependency:go-offline -B

  backend-test:
    needs: backend-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('clientes/pom.xml') }}
          restore-keys: maven-

      - name: Run backend tests
        working-directory: ./clientes
        run: mvn clean test -B

  frontend-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: clientes-app/package-lock.json

      - name: Install dependencies
        working-directory: ./clientes-app
        run: npm ci

  frontend-test:
    needs: frontend-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: clientes-app/package-lock.json

      - name: Install dependencies
        working-directory: ./clientes-app
        run: npm ci

      - name: Run frontend tests
        working-directory: ./clientes-app
        run: npm test -- --watch=false --browsers=ChromeHeadless

  deploy:
    needs: [ backend-test, frontend-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d ~/Clientes-FullStack ]; then
              git clone https://github.com/IgorBrunoAndradeDeBarros/Clientes-FullStack.git ~/Clientes-FullStack
            fi
            cd ~/Clientes-FullStack
            git pull origin main
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            docker compose down
            docker system prune -a -f --volumes
            docker compose up -d --build