version: "3.8"

services:
  backend:
    build:
      context: ./clientes
      dockerfile: Dockerfile
    container_name: clientes-backend
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-minha-chave-super-secreta-longa-aqui-2024}
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - clientes-net
    restart: unless-stopped

  frontend:
    build:
      context: ./clientes-app
      dockerfile: Dockerfile
    container_name: clientes-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - clientes-net
    restart: unless-stopped

networks:
  clientes-net:
    driver: bridge
